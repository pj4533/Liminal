name: Apple verification

on:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple toolchain
        run: |
          mkdir -p verification
          {
            sw_vers
            xcodebuild -version
            xcodebuild -showsdks
            xcrun simctl list devices available
          } 2>&1 | tee verification/toolchain.log
      - name: Build macOS
        timeout-minutes: 15
        id: mac_build
        run: |
          set -o pipefail
          xcodebuild CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/LiminalDerivedData" \
            -resultBundlePath verification/macos-build.xcresult \
            build 2>&1 | tee verification/macos-build.log
      - name: Chop feel fixture measurements
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.mac_build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/LiminalDerivedData" \
            -resultBundlePath verification/feel-metrics.xcresult \
            -only-testing:LiminalTests/DialogueFeelMetricsTests \
            2>&1 | tee verification/feel-metrics.log
          xcrun xcresulttool export attachments --path verification/feel-metrics.xcresult \
            --output-path verification/feel-attachments
          python3 scripts/dialogue-feel-report.py verification/feel-attachments > verification/feel-summary.json
          cat verification/feel-summary.json
      - name: Preserve chop feel measurements
        if: ${{ !cancelled() && steps.mac_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: chop-feel-${{ github.sha }}
          path: |
            verification/feel-attachments/
            verification/feel-summary.json
          retention-days: 14
      - name: Chop feel regression tests
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.mac_build.outcome == 'success' }}
        run: |
          set -o pipefail
          set +e
          xcodebuild test CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/LiminalDerivedData" \
            -resultBundlePath verification/feel-regression.xcresult \
            -only-testing:LiminalTests/DialogueChopFeelTests \
            -only-testing:LiminalTests/DialogueWordCutTests \
            -only-testing:LiminalTests/DialogueMotifTests \
            2>&1 | tee verification/feel-regression.log
          result=${PIPESTATUS[0]}
          xcrun xcresulttool export attachments --path verification/feel-regression.xcresult \
            --output-path verification/feel-regression-attachments
          exit "$result"
      - name: Preserve chop feel regression evidence
        if: ${{ !cancelled() && steps.mac_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: chop-feel-regression-${{ github.sha }}
          path: |
            verification/feel-regression.log
            verification/feel-regression-attachments/
          retention-days: 14
      - name: Focused dialogue tests
        timeout-minutes: 25
        if: ${{ !cancelled() && steps.mac_build.outcome == 'success' }}
        run: |
          set -o pipefail
          suites=()
          for source in LiminalTests/Dialogue*Tests.swift; do
            suites+=("-only-testing:LiminalTests/$(basename "$source" .swift)")
          done
          xcodebuild test CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/LiminalDerivedData" \
            -resultBundlePath verification/dialogue-tests.xcresult \
            "${suites[@]}" -only-testing:LiminalTests/DialogueLineLedgerTests \
            -only-testing:LiminalTests/FootageSalienceTests -only-testing:LiminalTests/FootageWeaverTests \
            2>&1 | tee verification/dialogue-tests.log
      - name: Full unit suite
        timeout-minutes: 30
        if: ${{ !cancelled() && steps.mac_build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/LiminalDerivedData" \
            -resultBundlePath verification/unit-tests.xcresult \
            -only-testing:LiminalTests 2>&1 | tee verification/unit-tests.log
      - name: Build visionOS Simulator when SDK is installed
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          if ! xcodebuild -showsdks | grep -q xrsimulator; then
            echo 'visionOS Simulator build unverified: no xrsimulator SDK installed.' | tee verification/visionos-build.log
            echo '### visionOS Simulator build unverified: SDK unavailable' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          xcodebuild CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/LiminalVisionDerivedData" \
            -resultBundlePath verification/visionos-build.xcresult \
            build 2>&1 | tee verification/visionos-build.log
      - name: Preserve verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-verification-${{ github.sha }}
          path: verification/
          retention-days: 14
          if-no-files-found: error
