name: Apple verification

on:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-verification-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple toolchain
        run: |
          mkdir -p verification
          { sw_vers; xcodebuild -version; xcodebuild -showsdks; } > verification/toolchain.log 2>&1
          git rev-parse HEAD > verification/revision.txt
      - name: Build macOS app and test bundle once
        timeout-minutes: 20
        id: mac_build
        run: |
          set -o pipefail
          xcodebuild -quiet build-for-testing CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/LiminalDerivedData" \
            -resultBundlePath verification/macos-build.xcresult \
            2>&1 | tee verification/macos-build.log
      - name: Complete unit suite with execution coverage
        timeout-minutes: 65
        if: ${{ !cancelled() && steps.mac_build.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 - <<'PY' > verification/required-suites.txt
          from pathlib import Path
          import runpy
          parser = runpy.run_path('scripts/verify-swift-test-coverage.py')
          print('\n'.join(sorted(name for name, tests in parser['declared_tests'](Path('LiminalTests')).items() if tests)))
          PY
          suites=()
          while IFS= read -r suite; do suites+=("$suite"); done < verification/required-suites.txt
          set +e
          xcodebuild test-without-building CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/LiminalDerivedData" \
            -resultBundlePath verification/unit-tests.xcresult \
            -only-testing:LiminalTests 2>&1 | tee verification/unit-tests.log
          result=${PIPESTATUS[0]}
          python3 scripts/verify-swift-test-coverage.py verification/unit-tests.log LiminalTests "${suites[@]}" > verification/test-coverage.json
          coverage=$?
          xcrun xcresulttool export attachments --path verification/unit-tests.xcresult --output-path verification/attachments
          attachments=$?
          python3 scripts/dialogue-feel-report.py verification/attachments > verification/feel-summary.json
          metrics=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          if [ "$coverage" -ne 0 ]; then exit "$coverage"; fi
          if [ "$attachments" -ne 0 ]; then exit "$attachments"; fi
          exit "$metrics"
      - name: Public fixture combined mix and peak verification
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.mac_build.outcome == 'success' }}
        env:
          DD: ${{ runner.temp }}/LiminalDerivedData
          LIMINAL_CAPTURE_CODE_SIGNING_ALLOWED: 'NO'
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/mix-venv"
          "$RUNNER_TEMP/mix-venv/bin/pip" install numpy scipy matplotlib > verification/mix-install.log 2>&1
          export PATH="$RUNNER_TEMP/mix-venv/bin:$PATH"
          echo 'Public synthesized speech and drums; this does not certify authentic speech or private drums.' > verification/mix-scope.txt
          scripts/mix-report.sh --out "$RUNNER_TEMP/public-mix" --bars 32 --bpm 72 --seed 1042 --no-plots --strict \
            2>&1 | tee verification/public-mix.log
      - name: Preserve macOS verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-verification-${{ github.sha }}
          path: |
            verification/
            ${{ runner.temp }}/public-mix/
          retention-days: 14
          if-no-files-found: error
  visionos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build visionOS Simulator app
        shell: bash
        run: |
          mkdir -p verification
          set -o pipefail
          xcodebuild -quiet build CODE_SIGNING_ALLOWED=NO -project Liminal.xcodeproj -scheme Liminal \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/LiminalVisionDerivedData" \
            -resultBundlePath verification/visionos-build.xcresult \
            2>&1 | tee verification/visionos-build.log
      - name: Preserve visionOS verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionos-verification-${{ github.sha }}
          path: verification/
          retention-days: 14
          if-no-files-found: error
