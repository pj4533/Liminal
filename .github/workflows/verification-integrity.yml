name: Verification integrity diagnosis
on:
  push:
    branches: ['verify/integrity/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-integrity-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: after
      - uses: actions/checkout@v4
        with:
          ref: 47a01fe267a3972241ed6918d031fffe55f26ed2
          path: baseline
      - name: Test integrity tools and apply measurement-only baseline adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cd after
          python3 -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee ../verification/python-tests.log
          bash -n scripts/verify-real-media.sh scripts/mix-matrix.sh
          cd ../baseline
          git apply --check ../after/scripts/baseline-probe-measurement.patch
          git apply ../after/scripts/baseline-probe-measurement.patch
          python3 ../after/scripts/prepare-baseline-compiler.py .
          git diff > ../verification/baseline-measurement-adapter.patch
      - name: Compile historical measurement probe without capturing
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd baseline
          xcodebuild build-for-testing CODE_SIGNING_ALLOWED=NO -scheme Liminal -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/baseline-dd" 2>&1 | tee ../verification/baseline-build.log
      - name: Compile candidate independently
        if: ${{ !cancelled() }}
        id: candidate-build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd after
          xcodebuild build-for-testing CODE_SIGNING_ALLOWED=NO -scheme Liminal -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/after-dd" 2>&1 | tee ../verification/after-build.log
      - name: Run whole detector and selection suites
        if: ${{ !cancelled() && steps.candidate-build.outcome == 'success' }}
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cd after
          xcodebuild test-without-building CODE_SIGNING_ALLOWED=NO -scheme Liminal -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/after-dd" -resultBundlePath ../verification/integrity.xcresult -only-testing:LiminalTests/DialogueSalienceProbeTests -only-testing:LiminalTests/FootageSalienceTests 2>&1 | tee ../verification/after-tests.log
          result=${PIPESTATUS[0]}
          python3 scripts/verify-swift-test-coverage.py ../verification/after-tests.log LiminalTests DialogueSalienceProbeTests FootageSalienceTests > ../verification/test-coverage.json
          coverage=$?
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          exit "$coverage"
      - name: Require both independent build outcomes
        if: ${{ !cancelled() }}
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          CANDIDATE_BUILD: ${{ steps.candidate-build.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
        run: test "$BASELINE" = success && test "$CANDIDATE_BUILD" = success && test "$CANDIDATE" = success
      - name: Preserve integrity diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-integrity-${{ github.sha }}
          path: verification/
          retention-days: 14
